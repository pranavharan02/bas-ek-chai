name: Build and validate Bas Ek Chai
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:corpus
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: bas-ek-chai-static-game
          path: dist/client
          retention-days: 14
